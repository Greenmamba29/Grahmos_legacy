# Netlify builds the offline-first console PWA. The relay is a separate node service and is not
# deployed here; the console works without it and syncs when a relay URL is configured.
[build]
  command = "npm run build:core && npm run build -w @terranova/console"
  publish = "apps/console/dist"

[build.environment]
  NODE_VERSION = "22"

# The service worker and its manifest must never be served stale, or devices keep an old shell.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Hashed build assets and signed venue packs are immutable per build.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
