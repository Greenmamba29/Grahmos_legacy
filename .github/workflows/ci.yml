name: ci
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run gates
      - run: npm run build
      - name: Offline drill (installed device, origin dead)
        run: |
          npx playwright install --with-deps chromium
          npm i --no-save playwright
          E2E_REQUIRED=1 node scripts/e2e-offline.mjs
          E2E_REQUIRED=1 node scripts/e2e-relay.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-dist
          path: apps/console/dist
